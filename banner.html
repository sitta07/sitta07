<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:360px}
  .banner{position:relative;width:1200px;height:360px;overflow:hidden;
    background:radial-gradient(1200px 500px at 78% 18%, #1c2440 0%, #11141c 55%, #0b0d12 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  .glow{position:absolute;right:-120px;top:-140px;width:560px;height:560px;border-radius:50%;
    background:radial-gradient(circle,rgba(109,155,255,.22),rgba(109,155,255,0) 65%)}
  svg.net{position:absolute;right:28px;top:40px;opacity:.9}
  .content{position:absolute;left:64px;top:0;height:360px;display:flex;flex-direction:column;
    justify-content:center;gap:2px;z-index:2}
  .hi{color:#6d9bff;font-size:19px;font-weight:600;letter-spacing:.06em;margin-bottom:10px}
  h1{color:#f2f5fa;font-size:60px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .role{color:#cfd6e4;font-size:26px;font-weight:600;margin-top:10px}
  .tags{color:#8a93a6;font-size:19px;font-weight:500;margin-top:14px;letter-spacing:.01em}
  .loc{color:#6f7a8d;font-size:16px;margin-top:22px}
  .accent{color:#49d6a6}
  .bar{position:absolute;left:64px;bottom:40px;width:72px;height:4px;border-radius:3px;
    background:linear-gradient(90deg,#6d9bff,#bf91f3)}
</style></head>
<body>
<div class="banner">
  <div class="glow"></div>
  <svg class="net" width="440" height="280" viewBox="0 0 440 280">
    <g stroke-width="1.2" opacity=".5">
      <g stroke="#45507a">
        <line x1="60" y1="60" x2="180" y2="40"/><line x1="60" y1="60" x2="170" y2="150"/>
        <line x1="60" y1="190" x2="170" y2="150"/><line x1="60" y1="190" x2="180" y2="250"/>
        <line x1="180" y1="40" x2="310" y2="95"/><line x1="170" y1="150" x2="310" y2="95"/>
        <line x1="170" y1="150" x2="310" y2="210"/><line x1="180" y1="250" x2="310" y2="210"/>
        <line x1="310" y1="95" x2="410" y2="150"/><line x1="310" y1="210" x2="410" y2="150"/>
      </g>
    </g>
    <g>
      <circle cx="60" cy="60" r="9" fill="#6d9bff"/><circle cx="60" cy="190" r="9" fill="#6d9bff"/>
      <circle cx="180" cy="40" r="9" fill="#bf91f3"/><circle cx="170" cy="150" r="11" fill="#bf91f3"/>
      <circle cx="180" cy="250" r="9" fill="#bf91f3"/>
      <circle cx="310" cy="95" r="9" fill="#49d6a6"/><circle cx="310" cy="210" r="9" fill="#49d6a6"/>
      <circle cx="410" cy="150" r="11" fill="#e0734f"/>
    </g>
  </svg>
  <div class="content">
    <div class="hi">HELLO, WORLD 👋</div>
    <h1>Sitta Boonkaew</h1>
    <div class="role">AI / ML Engineer</div>
    <div class="tags">AI Agents <span class="accent">·</span> Document AI <span class="accent">·</span> Computer Vision <span class="accent">·</span> MLOps</div>
    <div class="loc">📍 Bangkok, Thailand</div>
  </div>
  <div class="bar"></div>
</div>
</body></html>
